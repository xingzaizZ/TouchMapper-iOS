name: Build IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      sign_mode:
        description: '签名方式：unsigned（未签名，需自签）/ adhoc（自签 ad-hoc，需要 Secrets）'
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - adhoc
      create_release:
        description: '构建成功后自动发布到 Releases（生成可直链下载的 IPA）'
        required: false
        default: true
        type: boolean

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TouchMapper IPA
    runs-on: macos-15
    timeout-minutes: 40

    env:
      SCHEME: TouchMapper
      PROJECT: ios/TouchMapper.xcodeproj
      BUNDLE_ID: com.xiaogege.touchmapper
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── 编译期先跑一遍 Swift 语法自检，能在打包前把明显的语法错误挡下来 ──
      - name: Swift syntax sanity check
        run: |
          set -o pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! xcrun swiftc -parse "$f" 2>build_parse.err; then
              echo "::error file=$f::语法解析失败"
              cat build_parse.err
              fail=1
            fi
          done < <(find ios/TouchMapper/Sources -name '*.swift' -print0)
          rm -f build_parse.err
          exit $fail

      # ── 未签名归档 ──
      - name: Build archive (unsigned)
        if: ${{ github.event.inputs.sign_mode != 'adhoc' }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TouchMapper.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="1.1.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build archive | tee build/xcodebuild.log | tail -n 60

      # ── ad-hoc 签名归档（需要 6 个 Secrets，见 README） ──
      - name: Import signing certificate
        if: ${{ github.event.inputs.sign_mode == 'adhoc' }}
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISION: ${{ secrets.IOS_ADHOC_PROVISION }}
          KEYCHAIN_PASS: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$RUNNER_TEMP/profile"
          echo "$PROVISION" | base64 --decode > "$RUNNER_TEMP/profile/adHoc.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile/adHoc.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build archive (ad-hoc)
        if: ${{ github.event.inputs.sign_mode == 'adhoc' }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TouchMapper.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="TouchMapperAdHoc" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="1.1.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build archive | tee build/xcodebuild.log | tail -n 60

      # ── 打包成 IPA ──
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/TouchMapper.xcarchive/Products/Applications/$SCHEME.app"
          test -d "$APP" || { echo "app not found"; ls -R build/TouchMapper.xcarchive/Products; exit 1; }

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          ls -la build/Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "build/Payload/$SCHEME.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/Payload/$SCHEME.app/Info.plist"

          MODE="${{ github.event.inputs.sign_mode }}"
          MODE="${MODE:-unsigned}"
          NAME="TouchMapper-${MODE}-v1.1.0-b${GITHUB_RUN_NUMBER}"

          cd build
          zip -qry "${NAME}.ipa" Payload
          shasum -a 256 "${NAME}.ipa" | tee "${NAME}.ipa.sha256"
          ls -lh "${NAME}.ipa"
          echo "IPA_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchMapper-ipa
          path: |
            build/*.ipa
            build/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # ── 发到 Releases，拿到固定下载链接 ──
      - name: Publish to Releases
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-b${{ github.run_number }}
          name: TouchMapper v1.1.0 (build ${{ github.run_number }})
          body: |
            ## TouchMapper iOS 构建

            - 构建号：`${{ github.run_number }}`
            - 签名：`${{ github.event.inputs.sign_mode }}`
            - Xcode：`${{ runner.os }}` / SDK 见构建日志

            ### 本次改动
            - 新增按键映射引擎：手指落在按钮上时，发送的是按钮绑定的坐标，而不是手指位置
            - 新增内置王者荣耀横屏键位（普攻 / 三技能 / 召唤师技能 / 回城 / 恢复 / 移动摇杆）
            - 新增摇杆落点模式、连发、参与映射开关
            - 键位面板按下的按钮会高亮反馈

            ### 安装
            - **unsigned** 包不能直接安装，需用 Sideloadly / AltStore 自签
            - **adhoc** 包需要对应设备 UDID 已加入描述文件
          files: |
            build/*.ipa
            build/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## TouchMapper iOS 构建结果"
            echo ""
            echo "- 构建号：\`${{ github.run_number }}\`"
            echo "- Xcode：\`$(xcodebuild -version | head -n1)\`"
            echo "- 产物：\`${{ env.IPA_NAME }}.ipa\`"
            echo ""
            echo "Artifact 里直接下载上方的 \`TouchMapper-ipa\`。"
          } >> "$GITHUB_STEP_SUMMARY"
