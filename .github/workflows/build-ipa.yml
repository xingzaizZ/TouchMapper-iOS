name: Build IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      sign_mode:
        description: '签名方式：unsigned（未签名）/ adhoc（自签 ad-hoc）'
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - adhoc

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TouchMapper IPA
    runs-on: macos-14
    timeout-minutes: 30

    env:
      SCHEME: TouchMapper
      PROJECT: ios/TouchMapper.xcodeproj
      BUNDLE_ID: com.xiaogege.touchmapper
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TouchMapper.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build archive | tee build/xcodebuild.log | tail -n 40

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/TouchMapper.xcarchive/Products/Applications/$SCHEME.app"
          test -d "$APP" || { echo "app not found"; ls -R build/TouchMapper.xcarchive/Products; exit 1; }

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          # 顺手做一次基本自检：二进制存在、Info.plist 可读
          ls -la build/Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/$SCHEME.app/Info.plist

          cd build
          zip -qry TouchMapper-unsigned.ipa Payload
          ls -lh TouchMapper-unsigned.ipa
          shasum -a 256 TouchMapper-unsigned.ipa | tee TouchMapper-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TouchMapper-unsigned-ipa
          path: |
            build/TouchMapper-unsigned.ipa
            build/TouchMapper-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "## TouchMapper iOS 构建结果"
            echo ""
            echo "- 构建号：\`${{ github.run_number }}\`"
            echo "- Xcode：\`$(xcodebuild -version | head -n1)\`"
            echo "- 产物：\`TouchMapper-unsigned.ipa\`（未签名）"
            echo ""
            echo "### 安装方法"
            echo "未签名 IPA 无法直接点开安装，需自己重签："
            echo ""
            echo "1. **Windows / macOS：Sideloadly** — 导入 IPA，填 Apple ID，自动签名并安装"
            echo "2. **macOS：Xcode** — \`xcodebuild -exportArchive\` 或 AltStore"
            echo "3. **自备证书**：解开 IPA，替换 \`_CodeSignature\`，用 \`codesign -f -s \"证书\"\` 重签后重新打包"
          } >> "$GITHUB_STEP_SUMMARY"
